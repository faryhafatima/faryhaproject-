<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Frontend + Netlify Backend</p>
    </header>


    <main>

        <!-- Test Backend -->
        <section>
            <h2>Test Backend</h2>

            <button onclick="getMessage()">
                Connect to Backend
            </button>

            <p id="result"></p>
        </section>


        <!-- Add User -->
        <section>
            <h2>Add User</h2>

            <form id="userForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">
                    Add User
                </button>

            </form>

            <p id="userResult"></p>
        </section>


        <!-- Show Users -->
        <section>
            <h2>Users</h2>

            <button onclick="getUsers()">
                Show Users
            </button>

            <div id="usersList"></div>
        </section>

    </main>


    <footer>
        <p>My Website</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
