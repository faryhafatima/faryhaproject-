<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <h1>My Website</h1>

        <p>Frontend + Backend + Database</p>

    </header>


    <main>

        <!-- Backend Test -->

        <section>

            <h2>Test Backend</h2>

            <button onclick="getMessage()">
                Connect to Backend
            </button>

            <p id="result"></p>

        </section>


        <!-- Add User -->

        <section>

            <h2>Add User</h2>

            <form onsubmit="addUser(); return false;">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">
                    Add User
                </button>

            </form>

            <p id="userResult"></p>

        </section>


        <!-- Display Users -->

        <section>

            <h2>Users</h2>

            <button onclick="getUsers()">
                Show Users
            </button>

            <div id="usersList"></div>

        </section>

    </main>


    <footer>

        <p>My Website</p>

    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
